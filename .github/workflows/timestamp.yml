name: Verify Momento history
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: momento-timestamp
  cancel-in-progress: false
jobs:
  # Merge-time repair: a GitHub-UI merge/squash/rebase or web edit lands on
  # main without hook receipts. Amend HEAD with the correct parent links,
  # stamp via the public API, and force-push before verification, so the badge
  # recovers automatically. No-op when HEAD is already attested.
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/attest-unverified.mjs --update-branch main --no-rebase
  verify:
    needs: [repair]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: ./
        id: stamp
        with:
          mode: verify-history
          start-commit: ${{ vars.MOMENTO_START_COMMIT }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: momento-${{ steps.stamp.outputs.commit }}
          path: momento-proof/
          if-no-files-found: error
