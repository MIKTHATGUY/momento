name: Verify Momento history
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: momento-timestamp
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: ./
        id: stamp
        with:
          mode: verify-history
          start-commit: ${{ vars.MOMENTO_START_COMMIT }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: momento-${{ steps.stamp.outputs.commit }}
          path: momento-proof/
          if-no-files-found: error
