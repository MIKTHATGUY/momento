name: Release packages
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Validate and build release archives
        run: bun run pack:release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Test installed archives outside the workspace
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/momento-install"
          cd "$RUNNER_TEMP/momento-install"
          npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/release/*.tgz
          node --input-type=module -e "import {PROTOCOL_VERSION} from '@mikthatguy/momento-protocol'; if(PROTOCOL_VERSION!==2) throw Error('Wrong protocol')"
          test -x node_modules/.bin/momento-timestamp
      - uses: actions/upload-artifact@v7
        with:
          name: momento-release
          path: release/
          if-no-files-found: error
  attach:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: momento-release
          path: release
      - name: Attach downloadable archives and checksums
        run: gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
  publish:
    if: github.event_name == 'release'
    needs: [build, attach]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: momento-release
          path: release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global npm@11
      - name: Publish protocol then CLI using npm trusted publishing
        shell: bash
        run: |
          cd release
          sha256sum --check SHA256SUMS
          npm publish mikthatguy-momento-protocol-*.tgz --access public --tag "$DIST_TAG"
          npm publish mikthatguy-momento-timestamp-*.tgz --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
